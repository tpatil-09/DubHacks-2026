[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safematch-background-check"
version = "0.1.0"
description = "Havenly three-agent public-source background research pipeline (Investigator, Verifier, Synthesizer)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
safematch = "safematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safematch = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: performs real Claude Code / web searches; opt-in (pytest -m live, or RUN_LIVE=1)",
]
